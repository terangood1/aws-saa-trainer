<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AWS SAA Trainer{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <style>
        body { color: #172233; }
        .site-container { max-width: 54rem; }
        .site-header { background-color: #203b59; }
        .question-text { line-height: 1.7; overflow-wrap: anywhere; white-space: pre-line; }
    </style>
</head>
<body class="bg-white">
    <header class="site-header">
        <nav class="navbar container site-container gap-2 px-3 px-sm-4 py-3" aria-label="주 메뉴">
            <a class="navbar-brand text-white fw-bold me-0" href="{% url 'questions:list' %}">
                AWS SAA Trainer
            </a>
            <div class="nav gap-2">
                <a class="btn btn-primary" href="{% url 'questions:list' %}"
                   {% if request.resolver_match.view_name == 'questions:list' %}aria-current="page"{% endif %}>
                    문제 목록
                </a>
            </div>
        </nav>
    </header>
    <main class="container site-container px-3 px-sm-4 py-4 py-md-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
